name: Validate
on:
  pull_request:
    branches:
      - develop
      - release
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: Build project
        run: npm run build
