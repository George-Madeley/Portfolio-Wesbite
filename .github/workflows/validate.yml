name: Validate
on:
  pull_request:
    branches:
      - develop
      - release
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: lint
        run: yarn lint

      - name: Build project
        run: yarn build
